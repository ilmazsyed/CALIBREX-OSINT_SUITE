# Render Blueprint: New → Blueprint → pick this repository.
services:
  - type: web
    name: calibrex-osint-studio
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: calibrex-db
          property: connectionString

databases:
  - name: calibrex-db
    plan: free
    databaseName: calibrex
    user: calibrex
