# Render Blueprint: New → Blueprint → pick this repository.
#
# Storage: this setup uses a persistent DISK with the built-in file store, so
# there is no separate database to expire. A disk requires a paid instance
# (Starter) and pins the service to a single instance — fine for this app.
#
# Prefer a managed Postgres instead? Remove the `disk:` block and `DATA_DIR`,
# set plan back to `free`, and add a database (see the commented block at the
# bottom) plus a DATABASE_URL env var. The app uses Postgres whenever
# DATABASE_URL is set, and the disk-backed file store otherwise.
services:
  - type: web
    name: calibrex-osint-studio
    runtime: node
    plan: starter            # disks are not available on the free plan
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: calibrex-data
      mountPath: /var/data    # accounts, reports, settings and the audit log live here
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Encrypts users' AI keys at rest. Keep it stable: changing it means users reconnect their AI.
      - key: AI_ENCRYPTION_KEY
        generateValue: true
      # Your public address — the live custom domain. Used for AI sign-in,
      # email links and the push "subject". Notifications themselves use
      # relative URLs, so they no longer depend on this.
      - key: PUBLIC_URL
        value: https://app.calibrex.org
      # Where the file store keeps its data; must match the disk mountPath above.
      - key: DATA_DIR
        value: /var/data
      # NewsData.io API key — the reliable keyword-search BACKUP (fires only when
      # GDELT is throttled; hard daily cap protects the free 200/day budget).
      # Set this in the Render dashboard; leave unset to run without the backup.
      - key: NEWSDATA_API_KEY
        sync: false
      # Currents API key — a commercial-use-OK keyword-search backup (fresher,
      # bigger free quota than NewsData). Optional; set in the dashboard to enable.
      - key: CURRENTS_API_KEY
        sync: false
      # NASA FIRMS MAP_KEY — free active-fire detections for the Earth Watch /
      # situation map. Request at firms.modaps.eosdis.nasa.gov/api/map_key.
      # Optional; unset = the fire layer is simply off. UCDP conflict data is
      # keyless and always on. (UCDP_VERSION / FIRMS_BBOX / FIRMS_DAYS are
      # optional overrides with sensible defaults.)
      - key: NASA_FIRMS_KEY
        sync: false
      # ACLED near-real-time conflict events (password-grant OAuth). Set both to
      # enable the ACLED half of the conflict layer; unset = UCDP-only (keyless).
      - key: ACLED_EMAIL
        sync: false
      - key: ACLED_PASSWORD
        sync: false
      # AISStream live vessel positions (free WebSocket key). Unset = the AIS /
      # vessels layer is simply off. AIS_BOXES (JSON) optionally overrides the AOI.
      - key: AISSTREAM_KEY
        sync: false

