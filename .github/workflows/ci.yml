name: CI

on:
  push:
    branches: [main, "hardening/**", "security/**"]
  pull_request:
    branches: [main, "hardening/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Enforce clean production dependency audit
        run: npm audit --omit=dev --audit-level=low
      - name: Capture full dependency advisory report (including development tooling)
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})})); console.log('Totals:',JSON.stringify(a.metadata?.vulnerabilities||{}))"
      - name: Fail on high or critical advisories in the full dependency tree
        run: npm audit --audit-level=high
      - name: Check staging smoke-test script syntax
        run: node --check scripts/staging-smoke.mjs
      - name: Type check
        run: npm run typecheck
      - name: Run automated tests
        run: npm test
      - name: Build production client
        run: npm run build
      - name: Run authenticated staging smoke tests when credentials are configured
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_EMAIL: ${{ secrets.STAGING_EMAIL }}
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
          STAGING_TOTP: ${{ secrets.STAGING_TOTP }}
          STAGING_EXPECT_HSTS: ${{ secrets.STAGING_EXPECT_HSTS }}
        run: |
          if [ -n "$STAGING_BASE_URL" ] && [ -n "$STAGING_EMAIL" ] && [ -n "$STAGING_PASSWORD" ]; then
            node scripts/staging-smoke.mjs
          else
            echo "::notice::Authenticated staging smoke tests skipped; configure STAGING_BASE_URL, STAGING_EMAIL and STAGING_PASSWORD to enable them."
          fi
